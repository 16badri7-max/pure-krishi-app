services:
  # ── NestJS Backend API ───────────────────────────────────────────
  - type: web
    name: pure-krishi-backend
    runtime: docker
    rootDir: apps/backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        value: purekrishi-prod-jwt-secret-2024-xk9mq7
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        value: https://htsnjgcgbxwtypgiqtjv.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0c25qZ2NnYnh3dHlwZ2lxdGp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1NDAzMDQsImV4cCI6MjExMDExNjMwNH0.2i8QeFrSmBkOjcMwFoPO6aGByGA5jpjfY88m9P6zqzQ
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://pure-krishi-app.vercel.app
      - key: WEB_URL
        value: https://pure-krishi-app.vercel.app

  # ── Python FastAPI AI Service ────────────────────────────────────
  - type: web
    name: pure-krishi-ai
    runtime: python
    rootDir: apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
